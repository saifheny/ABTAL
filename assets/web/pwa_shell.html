<!DOCTYPE html>
<html lang="ar">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#0f2d6b">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Abtal">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overflow: hidden;
	background-color: #0e275c;
	touch-action: none;
	user-select: none;
	-webkit-user-select: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status {
	top: 0;
	bottom: 0;
	background: radial-gradient(circle at 50% 35%, #1d4fb0 0%, $GODOT_SPLASH_COLOR 72%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
	z-index: 5;
}

#status-splash {
	top: 0;
	bottom: 0;
	max-height: 76%;
	max-width: 82%;
	margin: auto;
	border-radius: 28px;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 11%;
	width: min(360px, 68vw);
	height: 14px;
	margin: 0 auto;
	appearance: none;
	-webkit-appearance: none;
	border-radius: 999px;
	overflow: hidden;
	border: 2px solid rgba(255, 255, 255, 0.35);
	background: rgba(9, 20, 48, 0.72);
}

#status-progress::-webkit-progress-bar {
	background: rgba(9, 20, 48, 0.72);
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #ff8a1f 0%, #ffc44d 100%);
	border-radius: 999px;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #ff8a1f 0%, #ffc44d 100%);
	border-radius: 999px;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.75rem;
	border: 1px solid #9b3943;
	color: #f4f6fb;
	line-height: 1.45;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem 1.25rem;
	text-align: center;
	z-index: 6;
}

#abtal-pwa-banner {
	position: fixed;
	top: max(10px, env(safe-area-inset-top));
	left: 50%;
	transform: translateX(-50%);
	z-index: 50;
	display: none;
	align-items: center;
	gap: 10px;
	max-width: min(94vw, 480px);
	padding: 8px 12px;
	border-radius: 999px;
	background: rgba(12, 29, 68, 0.94);
	border: 2px solid rgba(255, 194, 72, 0.85);
	box-shadow: 0 8px 26px rgba(0, 0, 0, 0.42);
	color: #ffffff;
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
	font-size: 13px;
	font-weight: 600;
	backdrop-filter: blur(8px);
}

#abtal-pwa-banner.visible {
	display: flex;
}

#abtal-pwa-icon {
	width: 30px;
	height: 30px;
	border-radius: 8px;
	flex-shrink: 0;
	object-fit: cover;
}

#abtal-pwa-text {
	line-height: 1.25;
}

#abtal-pwa-install-btn {
	border: 0;
	border-radius: 999px;
	padding: 6px 14px;
	font-size: 13px;
	font-weight: 700;
	color: #fff;
	background: linear-gradient(180deg, #ff9924 0%, #e56a00 100%);
	cursor: pointer;
	flex-shrink: 0;
}

#abtal-pwa-close-btn {
	border: 0;
	background: transparent;
	color: rgba(255, 255, 255, 0.78);
	font-size: 16px;
	line-height: 1;
	padding: 4px 6px;
	cursor: pointer;
	flex-shrink: 0;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="abtal-pwa-banner" role="region" aria-label="Install App">
			<img id="abtal-pwa-icon" src="icon-192.png" alt="Abtal">
			<span id="abtal-pwa-text"></span>
			<button id="abtal-pwa-install-btn" type="button"></button>
			<button id="abtal-pwa-close-btn" type="button" aria-label="Close">&times;</button>
		</div>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// Capture beforeinstallprompt early and wire user-friendly PWA install banner
	const banner = document.getElementById('abtal-pwa-banner');
	const textEl = document.getElementById('abtal-pwa-text');
	const installBtn = document.getElementById('abtal-pwa-install-btn');
	const closeBtn = document.getElementById('abtal-pwa-close-btn');
	const isAr = (navigator.language || '').toLowerCase().startsWith('ar');
	if (banner) {
		banner.dir = isAr ? 'rtl' : 'ltr';
	}
	const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
	let deferredPrompt = null;
	let dismissed = false;

	closeBtn.addEventListener('click', () => {
		dismissed = true;
		banner.classList.remove('visible');
	});

	installBtn.addEventListener('click', async () => {
		if (!deferredPrompt) {
			return;
		}
		installBtn.disabled = true;
		try {
			await deferredPrompt.prompt();
			await deferredPrompt.userChoice;
		} catch (_err) {
			// Ignore browser cancel errors
		}
		deferredPrompt = null;
		banner.classList.remove('visible');
	});

	window.addEventListener('beforeinstallprompt', (e) => {
		e.preventDefault();
		if (isStandalone || dismissed) {
			return;
		}
		deferredPrompt = e;
		textEl.textContent = isAr ? 'تثبيت لعبة أبطال على جهازك' : 'Install Abtal as an App';
		installBtn.textContent = isAr ? 'تثبيت' : 'Install';
		installBtn.style.display = 'inline-block';
		installBtn.disabled = false;
		banner.classList.add('visible');
	});

	window.addEventListener('appinstalled', () => {
		deferredPrompt = null;
		banner.classList.remove('visible');
	});

	const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
	const isSafari = /safari/i.test(navigator.userAgent || '') && !/crios|fxios|edgios/i.test(navigator.userAgent || '');
	if (isIos && isSafari && !isStandalone) {
		setTimeout(() => {
			if (!dismissed && !deferredPrompt) {
				textEl.textContent = isAr
					? 'لتثبيت أبطال: اضغط مشاركة ثم إضافة للشاشة الرئيسية'
					: 'To install Abtal: tap Share then Add to Home Screen';
				installBtn.style.display = 'none';
				banner.classList.add('visible');
			}
		}, 2800);
	}

	// Ensure Web Audio unlocks cleanly on first user interaction on mobile browsers
	function unlockWebAudio() {
		try {
			if (window.GodotAudio && window.GodotAudio.ctx && window.GodotAudio.ctx.state === 'suspended') {
				window.GodotAudio.ctx.resume();
			}
		} catch (_err) {}
	}
	window.addEventListener('pointerdown', unlockWebAudio, { passive: true });
	window.addEventListener('keydown', unlockWebAudio, { passive: true });

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
